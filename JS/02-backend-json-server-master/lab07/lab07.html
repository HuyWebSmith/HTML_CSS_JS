<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <style>
        #blogs {
            font-family: Arial, Helvetica, sans-serif;
            border-collapse: collapse;
            width: 100%;
        }

        #blogs td,
        #blogs th {
            border: 1px solid #ddd;
            padding: 8px;
        }

        #blogs tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        #blogs tr:hover {
            background-color: #ddd;
        }

        #blogs th {
            padding-top: 12px;
            padding-bottom: 12px;
            text-align: left;
            background-color: #04AA6D;
            color: white;
        }
    </style>
</head>

<body>
    <h1>Table List blogs</h1>
    <div class="d-flex flex-column flex" style="width: 200px; height: auto;">
        <label for="inTitle">Title</label>
        <input type="text" id="inTitle">
        <label for="inAuthor">Author</label>
        <input type="text" id="inAuthor">
        <label for="inContent">Content</label>
        <input type="text" id="inContent">

    </div>

    <button id="btnSubmit" style="margin-top: 10px;" type="button">Save</button>
    <br><br>
    <table id="blogs">
        <thead>
            <th>Id</th>
            <th>Title</th>
            <th>Author</th>
            <th>Content</th>
            <th>Action</th>
        </thead>
        <tbody>
            
        </tbody>
    </table>
    <script src="./lab07.js"></script>
</body>

</html>
