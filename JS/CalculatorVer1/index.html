<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator JS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cal_container">
        <!-- Text input -->
    <input type="text" id="numA"> <br><br>
    <input type="text" id="numB"> <br><br>
    <input type="text" id="result" disabled="disabled"><br><br>

    <!-- Button -->    
        <div>
            <input type="button" id="add" value="+"
            onclick="setResult(add(getValueA(),getValueB()));">
            <input type="button" id="sub" value="-"
            onclick="setResult(sub(getValueA(),getValueB()));">
            <input type="button" id="mul" value="x"
            onclick="setResult(mul(getValueA(),getValueB()));">
            <input type="button" id="div" value=":"
            onclick="setResult(div(getValueA(),getValueB()));">
            <input type="button" id="mod" value="%"
            onclick="setResult(mod(getValueA(),getValueB()));">
        </div>
        <div class="number_field">
            <input type="button" id="num7" value="7">
            <input type="button" id="num8" value="8">
            <input type="button" id="num9" value="9">
            <input type="button" id="num4" value="4">
            <input type="button" id="num5" value="5">
            <input type="button" id="num6" value="6">
            <input type="button" id="num1"value="1">
            <input type="button" id="num2" value="2">
            <input type="button" id="num3" value="3">
            
        </div>
    </div>
 
    <script src="main.js"></script>
</body>
</html>
